<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>آپلود تصویر | دریافت لینک مستقیم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2rem;
            padding: 2rem 1.8rem;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        h1 {
            color: #f1f5f9;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subhead {
            color: #94a3b8;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 1.2rem;
        }

        .drop-zone {
            border: 2px dashed rgba(59, 130, 246, 0.4);
            background: rgba(15, 23, 42, 0.4);
            border-radius: 1.5rem;
            padding: 2.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .drop-zone.drag-over {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            transform: scale(1.01);
        }

        .drop-zone-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.8rem;
            opacity: 0.8;
        }

        .drop-zone-text {
            color: #cbd5e1;
            font-size: 1rem;
            font-weight: 500;
        }

        .drop-zone-hint {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        .preview-container {
            display: none;
            margin-bottom: 1.5rem;
            border-radius: 1.2rem;
            overflow: hidden;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            aspect-ratio: 16 / 10;
            align-items: center;
            justify-content: center;
        }

        .preview-container.active {
            display: flex;
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .btn {
            border: none;
            border-radius: 1rem;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            color: white;
            background: #3b82f6;
            box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.4);
        }

        .btn:hover:not(:disabled) {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 rgba(59, 130, 246, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: #334155;
            box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.3);
        }

        .btn-secondary:hover:not(:disabled) {
            background: #475569;
            box-shadow: 0 6px 20px 0 rgba(0, 0, 0, 0.4);
        }

        .btn-success {
            background: #10b981;
            box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover:not(:disabled) {
            background: #059669;
            box-shadow: 0 6px 20px 0 rgba(16, 185, 129, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .btn-group .btn {
            flex: 1 1 auto;
            min-width: 120px;
        }

        .status {
            margin-top: 1.2rem;
            padding: 0.8rem 1rem;
            border-radius: 0.8rem;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status.info {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .result-section {
            display: none;
            margin-top: 1.5rem;
            animation: fadeIn 0.4s ease;
        }

        .result-section.active {
            display: block;
        }

        .url-box {
            display: flex;
            align-items: center;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 0.3rem;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .url-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.8rem 1rem;
            color: #e2e8f0;
            font-size: 0.85rem;
            font-family: monospace;
            direction: ltr;
            text-align: left;
            outline: none;
            min-width: 0;
        }

        .url-box input::selection {
            background: #3b82f6;
        }

        .copy-btn {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 0.7rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
            margin-left: 0.2rem;
        }

        .copy-btn:hover {
            background: #2563eb;
        }

        .copy-btn.copied {
            background: #10b981;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner {
            display: inline-block;
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.7s linear infinite;
            margin-left: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* استایل‌های ریسپانسیو */
        @media (max-width: 480px) {
            .card {
                padding: 1.5rem 1.2rem;
                border-radius: 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .btn {
                font-size: 0.9rem;
                padding: 0.8rem 1rem;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn-group .btn {
                width: 100%;
            }
            .url-box {
                flex-direction: column;
                gap: 0.5rem;
                padding: 0.6rem;
            }
            .url-box input {
                width: 100%;
                text-align: center;
                padding: 0.6rem;
                background: rgba(255, 255, 255, 0.05);
                border-radius: 0.5rem;
            }
            .copy-btn {
                width: 100%;
                margin-left: 0;
                padding: 0.7rem;
            }
        }

        /* حالت لودینگ دکمه */
        .btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📸 آپلود تصویر</h1>
        <p class="subhead">لینک مستقیم و عمومی تصویر خود را دریافت کنید</p>

        <!-- ناحیه انتخاب / Drag & Drop -->
        <div class="drop-zone" id="dropZone">
            <span class="drop-zone-icon">🖼️</span>
            <div class="drop-zone-text">تصویر را بکشید و رها کنید</div>
            <div class="drop-zone-hint">یا کلیک کنید تا از دستگاه خود انتخاب کنید</div>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp" style="display: none;">
        </div>

        <!-- پیش‌نمایش -->
        <div class="preview-container" id="previewContainer">
            <img class="preview-image" id="previewImage" alt="پیش‌نمایش تصویر">
        </div>

        <!-- دکمه آپلود -->
        <button class="btn" id="uploadBtn" disabled>
            <span>🚀</span> آپلود تصویر
        </button>

        <!-- بخش وضعیت -->
        <div class="status" id="statusMessage"></div>

        <!-- بخش نتیجه (لینک) -->
        <div class="result-section" id="resultSection">
            <div class="url-box">
                <input type="text" id="directLink" readonly placeholder="لینک مستقیم اینجا نمایش داده می‌شود">
                <button class="copy-btn" id="copyBtn">کپی</button>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" id="openBtn">🌐 باز کردن تصویر</button>
                <button class="btn btn-success" id="newBtn">🔄 آپلود عکس جدید</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // المان‌ها
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const previewContainer = document.getElementById('previewContainer');
            const previewImage = document.getElementById('previewImage');
            const uploadBtn = document.getElementById('uploadBtn');
            const statusMessage = document.getElementById('statusMessage');
            const resultSection = document.getElementById('resultSection');
            const directLinkInput = document.getElementById('directLink');
            const copyBtn = document.getElementById('copyBtn');
            const openBtn = document.getElementById('openBtn');
            const newBtn = document.getElementById('newBtn');

            // وضعیت
            let selectedFile = null;
            let isUploading = false;

            // --- توابع کمکی ---
            function showStatus(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = 'status show ' + type;
            }

            function hideStatus() {
                statusMessage.className = 'status';
                statusMessage.textContent = '';
            }

            function setLoading(loading) {
                isUploading = loading;
                if (loading) {
                    uploadBtn.classList.add('loading');
                    uploadBtn.innerHTML = '<span class="spinner"></span> در حال آپلود...';
                    uploadBtn.disabled = true;
                } else {
                    uploadBtn.classList.remove('loading');
                    uploadBtn.innerHTML = '<span>🚀</span> آپلود تصویر';
                    // دکمه فقط در صورت وجود فایل و عدم آپلود فعال می‌شود
                    uploadBtn.disabled = !selectedFile || isUploading;
                }
            }

            function resetForm() {
                selectedFile = null;
                fileInput.value = '';
                previewContainer.classList.remove('active');
                previewImage.src = '';
                resultSection.classList.remove('active');
                directLinkInput.value = '';
                copyBtn.textContent = 'کپی';
                copyBtn.classList.remove('copied');
                hideStatus();
                setLoading(false);
                // بازگرداندن حالت اولیه دکمه آپلود
                uploadBtn.innerHTML = '<span>🚀</span> آپلود تصویر';
                uploadBtn.disabled = true;
            }

            function validateFile(file) {
                const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
                if (!validTypes.includes(file.type)) {
                    showStatus('❌ فقط فرمت‌های JPG، PNG، GIF و WebP مجاز هستند.', 'error');
                    return false;
                }
                // محدودیت حجم Catbox 200MB است، اما برای تجربه کاربری بهتر 20MB می‌گذاریم
                if (file.size > 20 * 1024 * 1024) {
                    showStatus('❌ حجم فایل نباید بیشتر از ۲۰ مگابایت باشد.', 'error');
                    return false;
                }
                return true;
            }

            function handleFile(file) {
                if (!file) return;
                hideStatus();
                if (!validateFile(file)) {
                    selectedFile = null;
                    previewContainer.classList.remove('active');
                    uploadBtn.disabled = true;
                    return;
                }

                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewContainer.classList.add('active');
                    resultSection.classList.remove('active');
                    uploadBtn.disabled = false;
                    hideStatus();
                };
                reader.readAsDataURL(file);
            }

            // --- رویدادهای انتخاب فایل ---
            dropZone.addEventListener('click', () => {
                if (!isUploading) fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });

            // Drag & Drop
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });

            dropZone.addEventListener('dragenter', () => {
                if (!isUploading) dropZone.classList.add('drag-over');
            });

            dropZone.addEventListener('dragover', () => {
                if (!isUploading) dropZone.classList.add('drag-over');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('drag-over');
            });

            dropZone.addEventListener('drop', (e) => {
                dropZone.classList.remove('drag-over');
                if (isUploading) return;
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    // فقط اولین فایل تصویری را پردازش کن
                    const file = files[0];
                    if (file.type.startsWith('image/')) {
                        handleFile(file);
                        // به‌روزرسانی input file برای هماهنگی (اختیاری)
                        // نمی‌توان فایل را مستقیماً به input اختصاص داد، اما متغیر selectedFile کافی است
                    } else {
                        showStatus('❌ لطفاً فقط یک فایل تصویری رها کنید.', 'error');
                    }
                }
            });

            // --- آپلود به Catbox ---
            async function uploadToCatbox(file) {
                const formData = new FormData();
                formData.append('reqtype', 'fileupload');
                formData.append('fileToUpload', file);

                const response = await fetch('https://catbox.moe/user/api.php', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    // تلاش برای خواندن متن خطا
                    const errorText = await response.text();
                    throw new Error(`خطای سرور (${response.status}): ${errorText || 'پاسخ نامعتبر'}`);
                }

                const link = await response.text();
                // بررسی اینکه آیا لینک معتبر است (باید با http شروع شود)
                if (!link || !link.startsWith('http')) {
                    throw new Error('پاسخ نامعتبر از سرویس آپلود: ' + link);
                }
                return link.trim();
            }

            uploadBtn.addEventListener('click', async () => {
                if (!selectedFile || isUploading) return;

                // بررسی مجدد اعتبار فایل (شاید تغییر کرده باشد)
                if (!validateFile(selectedFile)) {
                    return;
                }

                setLoading(true);
                hideStatus();
                showStatus('⏳ در حال آپلود تصویر به سرویس میزبانی...', 'info');

                try {
                    const directUrl = await uploadToCatbox(selectedFile);

                    // نمایش نتیجه
                    directLinkInput.value = directUrl;
                    resultSection.classList.add('active');
                    showStatus('✅ تصویر با موفقیت آپلود شد!', 'success');

                    // اسکرول به نتیجه
                    resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                } catch (error) {
                    console.error('Upload error:', error);
                    let errorMsg = '❌ آپلود ناموفق بود. ';
                    if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                        errorMsg += 'ممکن است سرویس آپلود در دسترس نباشد یا مرورگر شما از آپلود مستقیم جلوگیری کند (CORS). لطفاً اتصال اینترنت خود را بررسی کنید.';
                    } else {
                        errorMsg += error.message || 'خطای ناشناخته رخ داد.';
                    }
                    showStatus(errorMsg, 'error');
                } finally {
                    setLoading(false);
                }
            });

            // --- کپی لینک ---
            copyBtn.addEventListener('click', async () => {
                const url = directLinkInput.value;
                if (!url) return;

                try {
                    await navigator.clipboard.writeText(url);
                    copyBtn.textContent = '✓ کپی شد';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.textContent = 'کپی';
                        copyBtn.classList.remove('copied');
                    }, 2000);
                } catch (err) {
                    // روش جایگزین برای مرورگرهای قدیمی
                    directLinkInput.select();
                    document.execCommand('copy');
                    copyBtn.textContent = '✓ کپی شد';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.textContent = 'کپی';
                        copyBtn.classList.remove('copied');
                    }, 2000);
                }
            });

            // --- باز کردن تصویر ---
            openBtn.addEventListener('click', () => {
                const url = directLinkInput.value;
                if (url) {
                    window.open(url, '_blank', 'noopener,noreferrer');
                }
            });

            // --- آپلود عکس جدید ---
            newBtn.addEventListener('click', () => {
                resetForm();
                // فوکوس روی ناحیه drop zone
                dropZone.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });

            // مقداردهی اولیه
            setLoading(false);
            uploadBtn.disabled = true;
        })();
    </script>
</body>
</html>
